# The hook test suite, on every pull request.
#
# These tests were written long before this workflow. `plugins/kvendra-skills/tests/hook/`
# holds the fixture runner, an inbox suite, a local-variable suite, a session-resume suite and
# a differential run — 118 assertions between them — and until now nothing executed any of
# them. Tests that are written and never run cost what tests cost and protect nothing.
#
# There is deliberately NO `paths:` filter. A check that runs for some pull requests and not
# others cannot be a required check, because the ones it skips merge with nothing having looked
# at them. The two lint workflows beside this one ARE path-filtered, and rightly so: they lint
# particular files. This one is the gate.
#
# `e2e-real-binary.sh` is not here. It is opt-in and needs a real `kvendra` binary built from
# another repository (KVENDRA_BIN), so running it would make this check depend on a build that
# is not ours to keep green.
#
# The job name is short and stable because it goes into the branch ruleset as a required
# context. Renaming it does not fail anything — it silently stops protecting the branch, which
# is worse.

name: hook-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hook-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hook-tests:
    name: hook-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: The suite's two assumptions about the runner
        run: |
          set -euo pipefail
          # Several suites skip themselves when `jq` is absent, which on a required check would
          # read as green while testing nothing. Fail loudly instead.
          command -v jq >/dev/null || { echo "::error::jq is missing from this runner"; exit 1; }
          bash --version | head -1

      - name: Hook fixtures
        run: bash plugins/kvendra-skills/tests/hook/run-fixtures.sh

      - name: Inbox fixtures
        run: bash plugins/kvendra-skills/tests/hook/run-inbox-fixtures.sh

      - name: Local-variable fixtures
        run: bash plugins/kvendra-skills/tests/hook/run-lvr-fixtures.sh

      - name: Session-resume fixtures
        run: bash plugins/kvendra-skills/tests/hook/run-session-resume-fixtures.sh

      - name: Differential — unknown nested keys
        run: bash plugins/kvendra-skills/tests/hook/differential-unknown-nested.sh

      # The pipeline contract, once it exists.
      #
      # ROAD-KVD-SKILLS-3584CD builds a checker that validates what a skill emits against
      # PIPELINE-CONTRACT.md. The checker is ordinary repository content, but WIRING it here is
      # not: `.github/**` is a sensitive path and the engine refuses any change that touches it,
      # so this step has to be added by a person, by hand, and it is added BEFORE the roadmap
      # starts rather than after.
      #
      # Until the checker lands this step annotates every run with a warning naming the ROAD,
      # and checks nothing. That is deliberate: a step that passed quietly would be green by
      # absence, which is the same disease as a path-filtered required check. The moment F1
      # merges the file, this becomes a real gate with no further edit to this workflow.
      - name: Pipeline contract
        run: |
          set -euo pipefail
          runner=plugins/kvendra-skills/tests/pipeline-contract/run.sh
          if [[ ! -f "$runner" ]]; then
            echo "::warning::pipeline-contract checker not present yet — ROAD-KVD-SKILLS-3584CD, phase F1. This step checks nothing until it lands."
            exit 0
          fi
          bash "$runner"

      # The attribution checker — ROAD-KVD-SKILLS-4CB98B.
      #
      # Wired by hand on 2026-10-28, between F1 (which built the checker) and F2 (which makes
      # the tree pass it). `.github/**` is a sensitive path the engine refuses, so this step is
      # a person's job, as the step above was.
      #
      # Two modes, both gating:
      #   --fixtures  the checker's own suite. Green from the moment F1 merged.
      #   (no args)   the real skills/ tree. RED until F2 lands, deliberately.
      #
      # So `main` runs red on this step until F2 merges. That is the gate working, not a
      # breakage: the tree genuinely still promises a header no component implements, 23 times
      # over. A green step here before F2 would mean the checker checks nothing.
      - name: Attribution contract
        run: |
          set -euo pipefail
          runner=plugins/kvendra-skills/tests/attribution/run.sh
          if [[ ! -f "$runner" ]]; then
            echo "::error::attribution checker missing — it merged in ROAD-KVD-SKILLS-4CB98B F1 and must not disappear"
            exit 1
          fi
          bash "$runner" --fixtures
          bash "$runner"
