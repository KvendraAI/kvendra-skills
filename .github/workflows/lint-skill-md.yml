name: lint-skill-md

on:
  pull_request:
    paths:
      - 'plugins/kvendra-skills/skills/**/SKILL.md'
      - '.github/workflows/lint-skill-md.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/kvendra-skills/skills/**/SKILL.md'

jobs:
  lint:
    name: SKILL.md lint (EN-only + no-tech-specifics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: EN-only check
        id: en_only
        shell: bash
        run: |
          set -euo pipefail

          # Spanish-vocabulary patterns. Matched as standalone words (\b boundaries)
          # to minimise false positives. The broker-rules block uses neutral English
          # ("Each call requires a profile_id") so it does not trigger any of these.
          PATTERNS=(
            '\b[Cc]uando\b'
            '\b[Hh]acer\b'
            '\b[Ee]ste\b'
            '\b[Ee]sta\b'
            '\b[Ee]stas\b'
            '\b[Ee]stos\b'
            '\b[Ss]obre\b'
            '\b[Pp]ara\b'
            '\b[Cc]ada\b'
            '\b[Dd]espu[eé]s\b'
            '\b[Aa]ntes\b'
            '\b[Aa]plicaci[oó]n\b'
            '\b[Ff]unci[oó]n\b'
            '\b[Cc]omponente\b'
            '\b[Cc]omponentes\b'
            '\b[Pp]royecto\b'
            '\b[Uu]suario\b'
            '\b[Rr]equisito\b'
            '\b[Ii]nstalaci[oó]n\b'
            '\b[Tt]raducci[oó]n\b'
            '\b[Vv]alidaci[oó]n\b'
            '\bDevuelve\b'
            '\b[Ee]jecutar\b'
            '\b[Ll]anza\b'
            '\b[Aa]ctualiza\b'
            'á|é|í|ó|ú|ñ|¿|¡'
          )

          PATTERN_RE=$(IFS='|'; echo "${PATTERNS[*]}")

          fail=0
          while IFS= read -r -d '' f; do
            if grep -nE "$PATTERN_RE" "$f" | grep -v 'lint-allow-es' > /tmp/lint_hits.txt; then
              if [[ -s /tmp/lint_hits.txt ]]; then
                echo "::error file=$f::EN-only lint failed in $f. Spanish tokens detected:"
                sed -e "s|^|$f:|" /tmp/lint_hits.txt
                fail=1
              fi
            fi
          done < <(find plugins/kvendra-skills/skills -name SKILL.md -print0)

          if [[ $fail -ne 0 ]]; then
            echo ""
            echo "Migration guidance:"
            echo "  - Translate the flagged lines to English. The runtime agent"
            echo "    translates output to the project's CLAUDE.md language at"
            echo "    runtime per ADR-KVD-SKILLS-244215."
            echo "  - If a line legitimately requires Spanish content (e.g. an"
            echo "    example quoting Spanish input), append '<!-- lint-allow-es -->'"
            echo "    at end-of-line to whitelist it."
            exit 1
          fi
          echo "EN-only check passed for all SKILL.md files."

      - name: No-tech-specifics check
        id: no_tech
        shell: bash
        run: |
          set -euo pipefail

          # Strategy:
          # - Track fenced-code-block state (lines inside ```...``` are skipped).
          # - Track section state (skip the entire '## External-execution rules'
          #   section, which is canonical documentation about the broker primitives
          #   and the FORBIDDEN-via-Bash list).
          # - Allow lines that reference 'kvendra.<primitive>' on the same line.
          # - Allow lines tagged with '<!-- lint-allow-tech -->' (escape hatch for
          #   prose that legitimately mentions commands as documentation, e.g.
          #   "the skill does NOT publish to cargo").
          # - Flag remaining bare tech-specific inline-code references.

          fail=0
          while IFS= read -r -d '' f; do
            out=$(awk '
              BEGIN { in_block = 0; in_external = 0 }

              # Section tracking
              /^## External-execution rules/ { in_external = 1; next }
              /^## / {
                if (!/^## External-execution rules/) in_external = 0
              }

              # Fenced code block tracking
              /^```/ { in_block = !in_block; next }
              in_block { next }
              in_external { next }

              {
                # Allow lines that reference broker primitives
                if (/kvendra\.(git|github|aws|npm|pypi|http|shell)/) next
                # Allow per-line whitelist
                if (/lint-allow-tech/) next
                # Flag bare tech-specific inline-code references
                if (/[`]aws s3 (sync|cp)[`]/ ||
                    /[`]sam deploy[`]/ ||
                    /[`]cargo publish[`]/ ||
                    /[`]npm publish[`]/ ||
                    /[`]pip upload[`]/ ||
                    /[`]twine upload[`]/ ||
                    /[`]docker run[`]/) {
                  printf("%s:%d:%s\n", FILENAME, NR, $0)
                }
              }
            ' "$f")
            if [[ -n "$out" ]]; then
              echo "::error file=$f::No-tech-specifics lint failed:"
              echo "$out"
              fail=1
            fi
          done < <(find plugins/kvendra-skills/skills -name SKILL.md -print0)

          if [[ $fail -ne 0 ]]; then
            echo ""
            echo "Migration guidance:"
            echo "  - Tech-specific recipes should live in STD entities of the"
            echo "    Kvendra KB (ADR-KVD-SKILLS-BB0E8A), read by the skill at"
            echo "    runtime via tag-based discovery (PAT-KVD-577667)."
            echo "  - The '## External-execution rules' section is whitelisted"
            echo "    because it is the canonical broker-primitive contract."
            echo "  - The broker primitive table ('kvendra.<primitive>') is"
            echo "    allowed because it is the skill-thin contract, not a"
            echo "    direct invocation."
            echo "  - If a line legitimately references a command in prose (e.g."
            echo "    'the skill does NOT publish to cargo'), append"
            echo "    '<!-- lint-allow-tech -->' at end-of-line."
            exit 1
          fi
          echo "No-tech-specifics check passed for all SKILL.md files."

      - name: No-mandatory-broker-block check
        id: no_mandatory_broker
        shell: bash
        run: |
          set -euo pipefail

          # Negative check: no SKILL.md may carry the legacy MANDATORY block.
          # Both spellings ("rules" and "rule") and both spacings are matched.
          legacy_hits=$(grep -lE '^## External-execution rules \(MANDATORY\)|^## External execution rules \(MANDATORY\)' \
                       plugins/kvendra-skills/skills/*/SKILL.md 2>/dev/null || true)
          if [[ -n "$legacy_hits" ]]; then
            echo "::error::Legacy '## External-execution rules (MANDATORY)' block found in SKILL.md files:"
            echo "$legacy_hits"
            echo ""
            echo "Migration guidance:"
            echo "  - Replace the legacy MANDATORY block with the canonical"
            echo "    '## External-execution policy' pointer per REQ-KVD-SKILLS-48062A."
            echo "  - See help({topic:'broker-policy'}) for the schema and the"
            echo "    canonical pointer text."
            exit 1
          fi

          # Positive check: every SKILL.md must carry the canonical pointer.
          missing=$(grep -L '^## External-execution policy' \
                    plugins/kvendra-skills/skills/*/SKILL.md 2>/dev/null || true)
          if [[ -n "$missing" ]]; then
            echo "::error::Missing canonical '## External-execution policy' pointer in:"
            echo "$missing"
            echo ""
            echo "Migration guidance:"
            echo "  - Every SKILL.md must reference the project's broker policy"
            echo "    via the canonical pointer section."
            echo "  - See help({topic:'broker-policy'}) for the canonical wording."
            exit 1
          fi

          echo "No-mandatory-broker-block check passed: legacy block absent, canonical pointer present in all SKILL.md files."

      - name: Guarded-update CAS adoption check
        id: cas_adoption
        shell: bash
        run: |
          set -euo pipefail

          # Every SKILL.md that issues an entity_update CALL (matched by the
          # call-syntax `entity_update(`, which excludes tool-catalogue prose
          # listings like user-help/env-check) MUST carry the canonical
          # guarded-update (CAS) rule, so the optimistic lock is sent on every
          # write (REQ-KVD-ENTERPRISE-7EC119 Paso B / ISSUE-KVD-SKILLS-F438CE).
          missing=""
          while IFS= read -r -d '' f; do
            if grep -q 'entity_update(' "$f"; then
              if ! grep -q 'Guarded update (CAS)' "$f"; then
                missing="$missing $f"
              fi
            fi
          done < <(find plugins/kvendra-skills/skills -name SKILL.md -print0)

          if [[ -n "$missing" ]]; then
            echo "::error::Writer SKILL.md missing the canonical 'Guarded update (CAS)' rule:"
            for m in $missing; do echo "  $m"; done
            echo ""
            echo "Migration guidance:"
            echo "  - Any skill that CALLS entity_update must read-modify-write with"
            echo "    expected_version and handle 409 VERSION_CONFLICT. Add the canonical"
            echo "    '**Guarded update (CAS)**' bullet to its '## Kvendra rules (summary)'."
            exit 1
          fi
          echo "Guarded-update CAS adoption check passed: all entity_update writers carry the rule."

      - name: No-false-engine-claims check
        id: no_false_engine_claims
        shell: bash
        run: |
          set -euo pipefail

          # Regression gate for the three defects fixed in REL-KVD-SKILLS-1.14.1
          # (ISSUE-KVD-SKILLS-B7F1CB / -890DAA / -BF4BA2). Each pattern below was
          # a literal, verified-false claim about the KB engine that shipped in
          # the plugin and produced orphan entities in customer KBs.
          # Class 1 + class 2 of PAT-KVD-5F888B. Self-contained by design: this
          # repo cannot reach the (private) engine repo, so the engine-side
          # counterparts live in kvendra-enterprise CI -- see ISSUE-KVD-SKILLS-B61520.
          fail=0

          # (1) Invented engine restriction. `ENTITY_CONFIG` exists in no repo;
          #     the engine accepts `relations` for every entity_type (the only
          #     validity gate is the entity_relations foreign key).
          if grep -rnE '(relations=no|ENTITY_CONFIG|does NOT accept relations|does not accept relations)' \
               plugins/kvendra-skills/skills/*/SKILL.md; then
            echo "::error::A SKILL.md claims the engine rejects relations for some entity_type."
            echo "  That claim is false and was the root cause of ISSUE-KVD-SKILLS-B7F1CB:"
            echo "  it made agents omit the relations argument, orphaning DOC and RUN entries."
            echo "  The engine has no per-type relation gate. Every non-PRJ entity carries"
            echo "  at least part_of to its PRJ. See the '### Relations - required, not"
            echo "  optional' section in doc-indexer / regression / incident-manager."
            fail=1
          fi

          # (2) False wire shape. COMPONENT_ID_RE = /^[A-Z][A-Z0-9]*$/ in
          #     @kvendra/enterprise-core rejects hyphens, so "<PROJ>-<COMP>"
          #     renders "KVD-SKILLS" and is refused by entity_create,
          #     entity_query, txn_create and txn_check_interrupted alike.
          if grep -rnE 'component_id: *"?<[A-Z_]+>-' plugins/kvendra-skills/skills/; then
            echo "::error::A component_id is documented with a project prefix."
            echo "  The field takes the BARE component code: \"SKILLS\", never \"KVD-SKILLS\"."
            echo "  Hyphenated values are rejected on all four surfaces (ISSUE-KVD-SKILLS-BF4BA2)."
            echo "  NOTE: force_id DOES take the full hyphenated entity id, and"
            echo "  tags_all:[\"CMP-<PROJ>-<COMP>\"] is a tag, not a component_id. Neither is"
            echo "  matched by the pattern above -- do not 'fix' them."
            fail=1
          fi

          # (3) Cited HTTP headers must be real. Measured 2026-09-10: the entire
          #     plugin cites exactly ONE header, and it did not exist in any repo
          #     (ISSUE-KVD-SKILLS-6D1A39). An allowlist therefore has a
          #     zero false-positive rate here. Adding a header to this list is a
          #     deliberate act that shows up in review -- which is the point.
          allowed_headers=" Authorization X-Id-Token "
          bad_headers=""
          while IFS= read -r h; do
            [[ -z "$h" ]] && continue
            if [[ "$allowed_headers" != *" $h "* ]]; then
              bad_headers="$bad_headers $h"
            fi
          done < <(grep -rhoE '\bX-[A-Za-z][A-Za-z0-9-]*' plugins/kvendra-skills/skills/*/SKILL.md | sort -u)

          # WARN-ONLY FOR NOW, deliberately. X-Kvendra-Skill is still cited in 23
          # SKILL.md because ISSUE-KVD-SKILLS-6D1A39 (defect E) was deferred out of
          # REL-KVD-SKILLS-1.14.1 on purpose. Enforcing today would break CI on the
          # first run -- the flag-off -> warn -> enforce rule of PAT-KVD-5F888B applies
          # to this gate too. FLIP TO ::error:: AND SET fail=1 in the same PR that
          # closes ISSUE-KVD-SKILLS-6D1A39.
          if [[ -n "$bad_headers" ]]; then
            echo "::warning::SKILL.md cites HTTP header(s) that are not in the allowlist:"
            for h in $bad_headers; do echo "  $h"; done
            echo ""
            echo "Migration guidance:"
            echo "  - The MCP client sends no custom headers. If a skill needs to identify"
            echo "    itself, use metadata.updated_by (a skill convention) and started_by on"
            echo "    txn_create (a declared, persisted field). A top-level updated_by is in"
            echo "    no tool schema and is dropped without an error."
            echo "  - If the header is genuinely implemented now, add it to allowed_headers"
            echo "    in this workflow IN THE SAME PR that implements it, citing the file"
            echo "    that reads it."
            # fail=1  <- uncomment when ISSUE-KVD-SKILLS-6D1A39 closes
          fi

          if [[ "$fail" -ne 0 ]]; then exit 1; fi
          echo "No-false-engine-claims check passed: no invented restriction, no bad component_id shape. Header check is warn-only until ISSUE-KVD-SKILLS-6D1A39 closes."
