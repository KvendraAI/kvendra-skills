name: mirror-private

# Keeps a private copy of this repo (KvendraAI/kvendra-skills-org) in sync so a
# claude.ai organization can add the marketplace with "Sync from GitHub", which
# only lists private/internal repos ("fork it to a private repo first").
#
# Push-from-public by design: a scheduled pull inside the private repo cannot
# work, because GITHUB_TOKEN is not allowed to push changes under
# .github/workflows/ and an exact mirror would delete its own sync workflow.
#
# Credential: an org-owned GitHub App installed ONLY on kvendra-skills-org with
# Contents + Workflows read/write (deploy keys are disabled by KvendraAI org
# policy; a PAT would expire and break the sync silently).
#
# Setup (one-time, owner):
#   - private repo KvendraAI/kvendra-skills-org, Actions DISABLED there (the
#     mirrored workflows must not run in the copy);
#   - repository variable MIRROR_APP_ID + secret MIRROR_APP_PRIVATE_KEY here.
# Without the secret the job skips with a notice instead of failing.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: mirror-private
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    name: Push main + tags to the private mirror
    if: github.repository == 'KvendraAI/kvendra-skills'
    runs-on: ubuntu-latest
    env:
      MIRROR_OWNER: KvendraAI
      MIRROR_NAME: kvendra-skills-org
    steps:
      - name: Check credentials
        id: creds
        shell: bash
        env:
          APP_ID: ${{ vars.MIRROR_APP_ID }}
          APP_KEY: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "${APP_ID}" || -z "${APP_KEY}" ]]; then
            echo "::notice::MIRROR_APP_ID / MIRROR_APP_PRIVATE_KEY not set; skipping the private mirror sync."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint installation token
        id: app
        if: steps.creds.outputs.present == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.MIRROR_APP_ID }}
          private-key: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          owner: ${{ env.MIRROR_OWNER }}
          repositories: ${{ env.MIRROR_NAME }}

      - uses: actions/checkout@v5
        if: steps.creds.outputs.present == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to mirror
        if: steps.creds.outputs.present == 'true'
        shell: bash
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          mirror="https://x-access-token:${TOKEN}@github.com/${MIRROR_OWNER}/${MIRROR_NAME}.git"

          # Push the current tip of main, not the event SHA: with back-to-back
          # pushes a late run must never roll the mirror back.
          git fetch --force --tags origin main
          git push --force "$mirror" "refs/remotes/origin/main:refs/heads/main"
          git push --force "$mirror" "refs/tags/*:refs/tags/*"

          echo "Mirror main -> $(git rev-parse refs/remotes/origin/main)"
